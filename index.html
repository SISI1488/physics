<!DOCTYPE html><html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Cosmic Physics Flash</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css">
  <style>
    :root {
      --space-dark: #0B0D17;
      --neon-blue: #00F5FF;
      --neon-pink: #FF10F0;
      --star-yellow: #FFE81F;
      --card-bg: rgba(13, 17, 31, 0.8);
      --text-light: #E0E0E0;
    }body {
  margin: 0;
  padding: 0;
  font-family: 'Roboto', sans-serif;
  background: var(--space-dark);
  color: var(--text-light);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  transition: background-image 0.5s ease;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-image: linear-gradient(rgba(11, 13, 23, 0.8), rgba(11, 13, 23, 0.8)), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
}

#particles-js {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -1;
  opacity: 0.7;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
  text-align: center;
  background-color: rgba(11, 13, 23, 0.7);
  border-radius: 15px;
  box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
}

h1 {
  font-family: 'Orbitron', sans-serif;
  color: var(--neon-blue);
  text-shadow: 0 0 10px var(--neon-blue);
  margin-bottom: 5px;
  font-size: 2.5rem;
}

.subtitle {
  color: var(--neon-pink);
  margin-bottom: 30px;
  font-size: 1.2rem;
}

#game-stats {
  display: flex;
  justify-content: space-around;
  background: rgba(0,0,0,0.5);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
  border: 1px solid var(--neon-blue);
}

.stat {
  display: flex;
  flex-direction: column;
}

.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5rem;
  color: var(--star-yellow);
}

#card-container {
  perspective: 1000px;
  width: 100%;
  max-width: 500px;
  height: 300px;
  margin: 20px auto;
  position: relative;
}

#card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  cursor: pointer;
}

.side {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 15px;
  padding: 30px;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card-bg);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
  border: 2px solid var(--neon-blue);
  text-align: center;
  font-size: 1.3rem;
  overflow: auto;
}

.back {
  transform: rotateY(180deg);
  border-color: var(--neon-pink);
}

.flipped {
  transform: rotateY(180deg);
}

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 30px;
}

button {
  background: linear-gradient(45deg, #0B0D17, #1A1C2E);
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 50px;
  font-family: 'Orbitron', sans-serif;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
  border: 1px solid var(--neon-blue);
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
}

button:active {
  transform: translateY(1px);
}

button::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    to bottom right,
    transparent,
    transparent,
    transparent,
    var(--neon-blue),
    transparent,
    transparent
  );
  transform: rotate(30deg);
  opacity: 0;
  transition: all 0.5s;
}

button:hover::before {
  animation: shine 1.5s;
}

@keyframes shine {
  0% { opacity: 0; left: -50%; }
  50% { opacity: 0.8; }
  100% { opacity: 0; left: 150%; }
}

.difficulty-selector {
  margin-top: 20px;
}

select {
  background: var(--space-dark);
  color: white;
  border: 1px solid var(--neon-blue);
  padding: 10px 15px;
  border-radius: 50px;
  font-family: 'Orbitron', sans-serif;
  cursor: pointer;
  outline: none;
}

.progress-container {
  width: 100%;
  height: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 5px;
  margin-top: 30px;
  overflow: hidden;
}

#progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
  transition: width 0.5s;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background-color: var(--neon-pink);
  opacity: 0;
  z-index: 1000;
  animation: confetti-fall 3s ease-in-out;
}

@keyframes confetti-fall {
  0% {
    transform: translateY(-100px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(1000px) rotate(360deg);
    opacity: 0;
  }
}

.level-up {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 3rem;
  color: var(--star-yellow);
  text-shadow: 0 0 20px var(--star-yellow);
  opacity: 0;
  z-index: 1001;
  animation: level-up 2s;
  font-family: 'Orbitron', sans-serif;
}

@keyframes level-up {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  80% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
}

#answer-input {
  background: rgba(13, 17, 31, 0.8);
  border: 2px solid var(--neon-blue);
  color: white;
  padding: 10px 15px;
  border-radius: 5px;
  font-size: 1rem;
  width: 80%;
  max-width: 400px;
  margin-top: 15px;
  font-family: 'Roboto', sans-serif;
}

#answer-input:focus {
  outline: none;
  border-color: var(--neon-pink);
  box-shadow: 0 0 10px var(--neon-pink);
}

#check-answer {
  margin-top: 10px;
  background: linear-gradient(45deg, #0B0D17, #1A1C2E);
  border: 1px solid var(--neon-pink);
}

#check-answer:hover {
  box-shadow: 0 0 20px rgba(255, 16, 240, 0.5);
}

.feedback {
  margin-top: 15px;
  font-size: 1.2rem;
  min-height: 24px;
}

.correct {
  color: #00FF87;
  text-shadow: 0 0 5px #00FF87;
}

.wrong {
  color: #FF6B00;
  text-shadow: 0 0 5px #FF6B00;
}

.praise {
  color: var(--star-yellow);
  text-shadow: 0 0 5px var(--star-yellow);
  font-weight: bold;
  font-size: 1.3rem;
}

.daily-task {
  background: rgba(0, 245, 255, 0.1);
  padding: 10px;
  border-radius: 10px;
  margin: 15px 0;
  border: 1px solid var(--neon-blue);
}

.task-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 5px;
}

.task-bar {
  height: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 5px;
  flex-grow: 1;
  margin: 0 10px;
  overflow: hidden;
}

.task-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-pink), var(--neon-blue));
  transition: width 0.5s;
}

.task-reward {
  color: var(--star-yellow);
  font-weight: bold;
}

@media (max-width: 600px) {
  h1 {
    font-size: 1.8rem;
  }
  .side {
    padding: 20px;
    font-size: 1.1rem;
  }
  #card-container {
    height: 250px;
  }
  .controls button {
    padding: 10px 15px;
    font-size: 0.9rem;
  }
}

  </style>
</head>
<body>
  <div id="particles-js"></div>  <div class="container">
    <h1>🚀 COSMIC PHYSICS FLASH</h1>
    <p class="subtitle">Изучай физику как космический исследователь!</p>
    
    <div id="daily-tasks">
      <div class="daily-task">
        <div>Ежедневная задача: ответьте правильно на 5 карточек</div>
        <div class="task-progress">
          <span id="task-counter">0/5</span>
          <div class="task-bar">
            <div class="task-progress-bar" id="task-progress-bar" style="width: 0%"></div>
          </div>
          <span class="task-reward">+50 очков</span>
        </div>
      </div>
    </div>
    
    <div id="game-stats">
      <div class="stat">
        <span>Уровень</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat">
        <span>Очки</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span>Комбо</span>
        <span class="stat-value" id="combo">0x</span>
      </div>
      <div class="stat">
        <span>Карточка</span>
        <span class="stat-value" id="counter">1/25</span>
      </div>
    </div>

    <div id="card-container">
      <div id="card">
        <div class="side front" id="front">Загрузка...</div>
        <div class="side back" id="back">Загрузка...</div>
      </div>
    </div>

    <div id="answer-section" style="display: none;">
      <input type="text" id="answer-input" placeholder="Введите ваш ответ...">
      <div class="controls">
        <button id="check-answer">Проверить ответ</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="progress-container">
      <div id="progress-bar"></div>
    </div>

    <div class="controls">
      <button onclick="prevCard()">◄ Назад</button>
      <button onclick="nextCard()">Вперёд ►</button>
      <button onclick="showAnswerInput()">✏ Ввести ответ</button>
      <button onclick="shuffleDeck()">🔄 Перемешать</button>
      <button onclick="resetStats()">🔄 Сбросить прогресс</button>
    </div>

    <div class="difficulty-selector">
      <select id="levelSelect" onchange="selectLevel()">
        <option value="all">Все уровни</option>
        <option value="easy">Лёгкий</option>
        <option value="medium">Средний</option>
        <option value="hard">Сложный</option>
      </select>
    </div>

  </div>

  <script>
    // Конфигурация частиц
    const particlesConfig = {
      "particles": {
        "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#00F5FF" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.5, "random": true },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#00F5FF", "opacity": 0.2, "width": 1 },
        "move": { "enable": true, "speed": 2, "direction": "none", "random": true, "straight": false, "out_mode": "out" }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": {
          "onhover": { "enable": true, "mode": "repulse" },
          "onclick": { "enable": true, "mode": "push" }
        }
      }
    };

    // Карточки с темами и фонами
    const flashcards = {
      easy: [
        { 
          q: "Что такое инерция?", 
          a: "Свойство тела сохранять состояние покоя или равномерного прямолинейного движения.",
          theme: "inertia",
          bg: "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["инерция", "покой", "движение", "состояние", "свойство тела"]
        },
        { 
          q: "Единица измерения силы?", 
          a: "Ньютон (Н)",
          theme: "force",
          bg: "https://images.unsplash.com/photo-1518770660439-4636190af475?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["ньютон", "н", "сила", "единица"]
        },
        { 
          q: "Формула силы?", 
          a: "F = ma (сила = масса × ускорение)",
          theme: "formula",
          bg: "https://images.unsplash.com/photo-1505506874110-6a7a69069a08?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["f=ma", "сила масса ускорение", "f = ma", "f=m*a", "f = m*a", "формула силы"]
        },
        { 
          q: "Что измеряют в ваттах?", 
          a: "Мощность",
          theme: "power",
          bg: "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["мощность", "ватт", "измерение"]
        },
        { 
          q: "Единица электрического сопротивления?", 
          a: "Ом (Ω)",
          theme: "electricity",
          bg: "https://images.unsplash.com/photo-1518544864410-91e8baf4b963?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["ом", "ω", "сопротивление", "электрическое"]
        }
      ],
      medium: [
        { 
          q: "Закон Ома?", 
          a: "I = U/R (сила тока = напряжение / сопротивление)",
          theme: "electricity",
          bg: "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["i=u/r", "закон ома", "сила тока напряжение сопротивление", "i = u/r", "i=u÷r", "i = u ÷ r"]
        },
        { 
          q: "Что такое импульс тела?", 
          a: "Произведение массы тела на его скорость (p = mv)",
          theme: "momentum",
          bg: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["импульс", "p=mv", "масса скорость", "p = mv", "p=m*v", "p = m*v"]
        }
      ],
      hard: [
        { 
          q: "Закон Бойля-Мариотта?", 
          a: "PV = const (для газа постоянной массы при постоянной температуре)",
          theme: "gas",
          bg: "https://images.unsplash.com/photo-1513297887119-d46091b24bfa?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["pv=const", "бойль мариотт", "газ температура", "p*v=const", "pv = const", "p×v=const"]
        },
        { 
          q: "Уравнение Шрёдингера описывает?", 
          a: "Изменение квантового состояния физической системы со временем",
          theme: "quantum",
          bg: "https://images.unsplash.com/photo-1517365884913-3c33884b06fa?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80",
          keywords: ["шрёдингер", "квантовое состояние", "физическая система", "изменение", "уравнение"]
        }
      ]
    };

    // Игровые переменные
    let current = 0;
    let flipped = false;
    let level = 'all';
    let currentDeck = [];
    let score = 0;
    let userLevel = 1;
    let xp = 0;
    let combo = 0;
    let maxCombo = 0;
    let cardStats = {};
    let hasAnswered = false;
    let dailyTaskCompleted = false;
    let dailyTaskProgress = 0;
    const DAILY_TASK_TARGET = 5;
    const DAILY_TASK_REWARD = 50;
    
    // DOM элементы
    const card = document.getElementById('card');
    const front = document.getElementById('front');
    const back = document.getElementById('back');
    const counterDisplay = document.getElementById('counter');
    const scoreDisplay = document.getElementById('score');
    const levelDisplay = document.getElementById('level');
    const comboDisplay = document.getElementById('combo');
    const progressBar = document.getElementById('progress-bar');
    const answerSection = document.getElementById('answer-section');
    const answerInput = document.getElementById('answer-input');
    const checkAnswerBtn = document.getElementById('check-answer');
    const feedback = document.getElementById('feedback');
    const taskCounter = document.getElementById('task-counter');
    const taskProgressBar = document.getElementById('task-progress-bar');

    // Похвальные фразы
    const praisePhrases = [
      "Ты гений физики! 🚀",
      "Великолепно! Ты просто звезда! ⭐",
      "Потрясающе! Ты настоящий учёный! 🔬",
      "Браво! Ты справился на отлично! 💯",
      "Фантастически! Ты молодец! 👏",
      "Умница! Так держать! 🌟",
      "Превосходно! Ты физик от бога! 🧠",
      "Великолепный ответ! Ты на верном пути! 🏆",
      "Идеально! Ты делаешь успехи! 🎯",
      "Блестяще! Ты настоящий Эйнштейн! 🌌"
    ];

    // Инициализация
    function init() {
      // Загружаем сохраненный прогресс
      loadProgress();
      selectLevel();
      updateStats();
      updateDailyTask();
      
      // Обработчик клика по карточке
      card.addEventListener('click', flipCard);
      
      // Обработчик проверки ответа
      checkAnswerBtn.addEventListener('click', checkAnswer);
      answerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          checkAnswer();
        }
      });
      
      // Запуск анимации частиц
      particlesJS("particles-js", particlesConfig);
    }
    
    // Сохраняем прогресс в localStorage
    function saveProgress() {
      const progress = {
        score,
        userLevel,
        xp,
        maxCombo,
        cardStats,
        dailyTaskCompleted,
        dailyTaskProgress,
        lastPlayDate: new Date().toDateString()
      };
      localStorage.setItem('cosmicPhysicsProgress', JSON.stringify(progress));
    }
    
    // Загружаем прогресс из localStorage
    function loadProgress() {
      const savedProgress = localStorage.getItem('cosmicPhysicsProgress');
      if (savedProgress) {
        const progress = JSON.parse(savedProgress);
        score = progress.score || 0;
        userLevel = progress.userLevel || 1;
        xp = progress.xp || 0;
        maxCombo = progress.maxCombo || 0;
        cardStats = progress.cardStats || {};
        
        // Проверяем, был ли сегодняшний день
        const today = new Date().toDateString();
        if (progress.lastPlayDate === today) {
          dailyTaskCompleted = progress.dailyTaskCompleted || false;
          dailyTaskProgress = progress.dailyTaskProgress || 0;
        } else {
          // Новый день - сбрасываем прогресс ежедневной задачи
          dailyTaskCompleted = false;
          dailyTaskProgress = 0;
        }
      }
    }
    
    // Сброс статистики
    function resetStats() {
      if (confirm("Вы уверены, что хотите сбросить весь прогресс?")) {
        score = 0;
        userLevel = 1;
        xp = 0;
        combo = 0;
        maxCombo = 0;
        cardStats = {};
        dailyTaskCompleted = false;
        dailyTaskProgress = 0;
        localStorage.removeItem('cosmicPhysicsProgress');
        updateStats();
        updateDailyTask();
        createConfetti();
      }
    }
    
    // Обновление ежедневной задачи
    function updateDailyTask() {
      const progress = (dailyTaskProgress / DAILY_TASK_TARGET) * 100;
      taskCounter.textContent = ${dailyTaskProgress}/${DAILY_TASK_TARGET};
      taskProgressBar.style.width = ${progress}%;
      
      if (dailyTaskCompleted) {
        taskCounter.textContent = "Задача выполнена!";
        taskProgressBar.style.width = "100%";
      }
    }
    
    // Выбор уровня сложности
    function selectLevel() {
      level = document.getElementById('levelSelect').value;
      current = 0;
      hasAnswered = false;
      
      if (level === 'all') {
        currentDeck = [...flashcards.easy, ...flashcards.medium, ...flashcards.hard];
      } else {
        currentDeck = [...flashcards[level]];
      }
      
      // Инициализация статистики по карточкам
      currentDeck.forEach((card, index) => {
        if (!cardStats[index]) {
          cardStats[index] = {
            views: 0,
            correct: 0,
            lastViewed: null
          };
        }
      });
      
      shuffleDeck();
    }
    
    // Перемешивание колоды
    function shuffleDeck() {
      shuffleArray(currentDeck);
      current = 0;
      updateCard();
    }
    
    // Обновление карточки
    function updateCard() {
      hasAnswered = false;
      answerSection.style.display = 'none';
      feedback.textContent = '';
      feedback.className = "feedback";
      
      const item = currentDeck[current];
      front.innerHTML = renderContent(item.q);
      back.innerHTML = renderContent(item.a);
      
      counterDisplay.textContent = ${current + 1}/${currentDeck.length};
      
      // Обновляем статистику просмотра
      cardStats[current].views++;
      cardStats[current].lastViewed = new Date();
      
      // Меняем фон в зависимости от темы
      changeBackground(item.bg);
      
      // Обновляем прогресс
      updateProgress();
      
      // Сохраняем прогресс
      saveProgress();
    }
    
    // Изменение фона
    function changeBackground(imageUrl) {
      document.body.style.backgroundImage = linear-gradient(rgba(11, 13, 23, 0.8), rgba(11, 13, 23, 0.8)), url(${imageUrl});
    }
    
    // Показать поле для ввода ответа
    function showAnswerInput() {
      if (hasAnswered) return;
      answerSection.style.display = 'block';
      answerInput.focus();
      feedback.textContent = '';
    }
    
    // Проверка ответа
    function checkAnswer() {
      if (hasAnswered) return;
      
      const userAnswer = normalizeString(answerInput.value.trim());
      const correctAnswer = normalizeString(currentDeck[current].a);
      const keywords = currentDeck[current].keywords || [];
      
      let isCorrect = false;
      
      // Проверяем по ключевым словам
      for (const keyword of keywords) {
        const normalizedKeyword = normalizeString(keyword);
        if (userAnswer.includes(normalizedKeyword)) {
          isCorrect = true;
          break;
        }
      }
      
      // Если нет ключевых слов или не нашли совпадение, проверяем полный ответ
      if (!isCorrect && keywords.length === 0) {
        isCorrect = userAnswer === correctAnswer;
      }
      
      if (isCorrect) {
        const praise = praisePhrases[Math.floor(Math.random() * praisePhrases.length)];
        feedback.innerHTML = <span class="correct">✅ Правильно!</span> <span class="praise">${praise}</span>;
        answerInput.value = '';
        answerSection.style.display = 'none';
        markCorrect();
      } else {
        feedback.innerHTML = <span class="wrong">❌ Неверно. Вот правильный ответ:</span><br>${currentDeck[current].a};
        combo = 0;
        updateStats();
        hasAnswered = true;
        
        // Через 3 секунды переходим к следующей карточке
        setTimeout(() => {
          nextCard();
        }, 3000);
      }
    }
    
    // Нормализация строки для сравнения
    function normalizeString(str) {
      return str.toLowerCase()
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, ' ')
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, '')
        .trim();
    }
    
    // Рендер контента с поддержкой KaTeX
    function renderContent(text) {
      // Простая проверка на формулы (можно улучшить)
      if (text.includes('=') || text.includes('\\') || text.includes('_') || text.includes('^')) {
        try {
          return katex.renderToString(text, { throwOnError: false });
        } catch (e) {
          return text;
        }
      }
      return text;
    }
    
    // Переворот карточки
    function flipCard() {
      if (hasAnswered) return;
      
      flipped = !flipped;
      
      if (flipped) {
        card.classList.add('flipped');
      } else {
        card.classList.remove('flipped');
      }
    }
    
    // Следующая карточка
    function nextCard() {
      current = (current + 1) % currentDeck.length;
      updateCard();
      animateCard('right');
    }
    
    // Предыдущая карточка
    function prevCard() {
      current = (current - 1 + currentDeck.length) % currentDeck.length;
      updateCard();
      animateCard('left');
    }
    
    // Анимация карточки
    function animateCard(direction) {
      card.style.transform = direction === 'right' ? 'translateX(20px)' : 'translateX(-20px)';
      card.style.opacity = '0';
      
      setTimeout(() => {
        card.style.transform = 'translateX(0)';
        card.style.opacity = '1';
      }, 200);
    }
    
    // Отметить как правильный ответ
    function markCorrect() {
      cardStats[current].correct++;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      // Начисление очков в зависимости от сложности
      let points = 10;
      if (level === 'medium') points = 20;
      if (level === 'hard') points = 30;
      
      // Бонус за комбо
      points += Math.floor(combo / 3) * 5;
      
      // Обновляем прогресс ежедневной задачи
      if (!dailyTaskCompleted) {
        dailyTaskProgress++;
        if (dailyTaskProgress >= DAILY_TASK_TARGET) {
          dailyTaskCompleted = true;
          points += DAILY_TASK_REWARD;
          feedback.innerHTML += <br><span class="praise">Вы выполнили ежедневную задачу! +${DAILY_TASK_REWARD} очков!</span>;
          createConfetti();
        }
        updateDailyTask();
      }
      
      score += points;
      xp += points;
      
      // Проверка уровня
      checkLevelUp();
      
      // Анимация
      createConfetti();
      
      // Переход к следующей карточке
      setTimeout(() => {
        nextCard();
      }, 1500);
      
      updateStats();
      hasAnswered = true;
      saveProgress();
    }
    
    // Проверка повышения уровня
    function checkLevelUp() {
      const xpNeeded = userLevel * 100;
      
      if (xp >= xpNeeded) {
        xp -= xpNeeded;
        userLevel++;
        
        // Анимация повышения уровня
        const levelUp = document.createElement('div');
        levelUp.className = 'level-up';
        levelUp.textContent = LEVEL UP! ${userLevel};
        document.body.appendChild(levelUp);
        
        setTimeout(() => {
          levelUp.remove();
        }, 2000);
      }
    }
    
    // Обновление статистики
    function updateStats() {
      scoreDisplay.textContent = score;
      levelDisplay.textContent = userLevel;
      comboDisplay.textContent = combo > 0 ? ${combo}x : '0x';
      comboDisplay.style.color = combo > 3 ? '#FF10F0' : '#00F5FF';
      comboDisplay.style.textShadow = combo > 3 ? '0 0 10px #FF10F0' : 'none';
      
      // Обновляем прогресс
      updateProgress();
    }
    
    // Обновление прогресс-бара
    function updateProgress() {
      const progress = ((current + 1) / currentDeck.length) * 100;
      progressBar.style.width = ${progress}%;
    }
    
    // Создание конфетти
    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = ${Math.random() * 100}%;
        confetti.style.backgroundColor = getRandomColor();
        confetti.style.animationDuration = ${2 + Math.random() * 3}s;
        document.body.appendChild(confetti);
        
        setTimeout(() => {
          confetti.remove();
        }, 3000);
      }
    }
    
    function getRandomColor() {
      const colors = ['#00F5FF', '#FF10F0', '#FFE81F', '#FF6B00', '#00FF87'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
    
    // Перемешивание массива
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }
    
    // Запуск приложения
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
